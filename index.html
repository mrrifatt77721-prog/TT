<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d19"><title>EarnZone</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#080d19;--p:#121e31;--line:#2b3a52;--txt:#f5f7ff;--muted:#96a6bd;--mint:#50efbd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#183e4b,transparent 40%),radial-gradient(ellipse at 100% 0,#29204b,transparent 32%),var(--bg);color:var(--txt);font-family:system-ui,sans-serif}.app{max-width:500px;margin:auto;padding:18px 15px 90px;min-height:100vh}.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#50efbd,#55c8ff);display:grid;place-items:center;color:#071b24;font-size:27px;font-weight:1000}.brand b{font-size:21px}.brand b span{color:var(--mint)}.muted{color:var(--muted)}.small{font-size:12px}.art{height:135px;border:1px solid #3b7778;border-radius:23px;background:linear-gradient(130deg,#155b58,#17446d,#2a214d);display:grid;place-items:center;font-size:57px;margin:23px 0;position:relative;overflow:hidden}.art:before,.art:after{content:"";position:absolute;border:1px solid #b5ffdf55;border-radius:50%;width:200px;height:200px}.art:after{width:145px;height:145px}.title{font-size:31px;line-height:1.12;font-weight:900;letter-spacing:-.8px;margin:13px 0}.card{background:linear-gradient(145deg,#142239,#101827);border:1px solid var(--line);border-radius:19px;padding:18px;margin:16px 0}.pill{display:inline-block;background:#14352f;border:1px solid #315c55;color:#a1f8dd;padding:6px 10px;border-radius:30px;font-size:10px;letter-spacing:.6px}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(110deg,#50efbd,#63d9e9);color:#05251c;font-weight:900;cursor:pointer}.feature{display:flex;gap:11px;margin:15px 0}.fi{width:38px;height:38px;border-radius:12px;background:#203149;display:grid;place-items:center;flex-shrink:0}.feature b{font-size:13px}.feature p{font-size:11px;color:var(--muted);line-height:1.5;margin:4px 0}.warn{padding:12px;background:#302819;border:1px solid #725c2c;color:#ffe2a4;border-radius:12px;font-size:11px;line-height:1.6}.navwrap{position:fixed;bottom:0;left:0;right:0;background:#0c1424ee;border-top:1px solid #29374b;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:3}.nav{max-width:490px;margin:auto;display:flex;gap:4px}.nav button{flex:1;background:transparent;border:0;color:#8798b1;border-radius:12px;padding:8px 0;font-size:10px}.nav button.active{background:#19382f;color:var(--mint)}.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}.task{display:flex;gap:10px;align-items:center;padding:12px;background:#111d30;border:1px solid #283951;border-radius:15px;margin:10px 0}.taskicon{font-size:22px;background:#203149;border-radius:13px;padding:10px}.taskbody{flex:1}.taskbody b{font-size:13px}.taskbody p{font-size:11px;color:var(--muted);margin:4px 0}.task button{width:auto;padding:9px 11px}.field{width:100%;padding:12px;margin:7px 0 12px;background:#091321;border:1px solid #34455c;border-radius:10px;color:white}.balance{font-size:36px;font-weight:900;margin:9px 0}.notice{margin-top:14px;font-size:11px;color:#afbed1;line-height:1.6}.toast{position:fixed;bottom:82px;left:15px;right:15px;max-width:450px;margin:auto;padding:13px;border-radius:12px;background:#d9fff2;color:#10362a;font-weight:800;font-size:12px;z-index:8}.hidden{display:none!important}
</style></head><body><div class="app"><header class="brand"><div class="logo">ϟ</div><div><b>Earn<span>Zone</span></b><div class="muted" style="font-size:10px;letter-spacing:1.4px">YOUR REWARD SPACE</div></div></header><main id="screen"></main></div><div id="navwrap" class="navwrap hidden"><div class="nav" id="nav"><button class="active" data-page="home"><i>⌂</i>Home</button><button data-page="tasks"><i>▤</i>Tasks</button><button data-page="refer"><i>♧</i>Refer</button><button data-page="wallet"><i>▣</i>Wallet</button><button data-page="profile"><i>☻</i>Profile</button></div></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{const $=s=>document.querySelector(s),screen=$('#screen'),tg=window.Telegram?.WebApp;let user=null,page='home',balance=0,done=[],requests=[],timer;
const tasks=[{id:1,icon:'🎁',name:'Daily check-in',desc:'Claim your daily reward',points:20},{id:2,icon:'✈️',name:'Join the community',desc:'Visit the community channel',points:50},{id:3,icon:'▶️',name:'Watch & learn',desc:'Open the featured video',points:30},{id:4,icon:'📣',name:'Read announcement',desc:'Read the latest update',points:25}];
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),2600)}function save(){try{localStorage.setItem('ez-tg-preview',JSON.stringify({balance,done,requests}))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem('ez-tg-preview')||'{}');balance=s.balance||0;done=s.done||[];requests=s.requests||[]}catch(e){}}
function login(){ $('#navwrap').classList.add('hidden');screen.innerHTML=`<div class="art">ϟ</div><span class="pill">✦ TELEGRAM-FIRST SIGN IN</span><div class="title">Your rewards.<br>Your Telegram.</div><p class="muted" style="font-size:13px;line-height:1.7">Continue with Telegram to enter your personal EarnZone space. No separate password required.</p><div class="card"><b style="font-size:16px">Sign in to continue</b><p class="muted small" style="line-height:1.7">Open this app from your Telegram bot's Mini App button for Telegram identity data.</p><button id="login" class="btn">➤ &nbsp; Continue with Telegram</button><div style="height:1px;background:#2b3a52;margin:18px 0"></div><div class="feature"><div class="fi">🛡️</div><div><b>Identity protection</b><p>The server must verify Telegram's signed initData before trusting the account.</p></div></div><div class="feature"><div class="fi">⚡</div><div><b>One-tap access</b><p>Use your Telegram account to enter the Mini App.</p></div></div><div class="warn"><b>Preview mode:</b> Outside Telegram, the button only opens a local preview session. This is not real authentication. A configured secure backend is required.</div></div><p class="muted" style="text-align:center;font-size:10px">EarnZone · Telegram login starter</p>`}
function taskCard(t){let d=done.includes(t.id);return `<div class="task"><div class="taskicon">${t.icon}</div><div class="taskbody"><b>${t.name}</b><p>${t.desc}</p><span style="color:#50efbd;font-size:12px;font-weight:800">+${t.points} points</span></div><button class="btn" data-task="${t.id}" ${d?'disabled style="opacity:.55"':''}>${d?'✓ Done':'Start'}</button></div>`}
function home(){return `<div style="padding-top:24px"><div class="muted small">Welcome, ${esc(user?.first_name||'Telegram User')} 👋</div><div class="title" style="font-size:29px">Make today count.</div><div class="card" style="padding:22px;background:linear-gradient(125deg,#155d57,#17456c,#29204e);border-color:#327d76"><span class="pill">✦ MEMBER WALLET</span><div class="muted small" style="margin-top:23px;color:#d3f7ef">Available preview balance</div><div class="balance">৳ ${balance.toLocaleString('en-BD')}</div><div class="small" style="color:#c1e8e4">Keep going — every task moves you forward.</div><button class="btn" data-jump="tasks" style="margin-top:18px">Explore tasks ↗</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[[done.length,'Tasks done'],[tasks.length-done.length,'Tasks left'],[requests.length,'Requests']].map(x=>`<div class="card" style="padding:13px 9px;margin:0"><b style="font-size:23px">${x[0]}</b><div class="muted" style="font-size:10px;margin-top:5px">${x[1]}</div></div>`).join('')}</div><h3 style="margin-top:26px">Recommended for you</h3>${tasks.filter(t=>!done.includes(t.id)).slice(0,2).map(taskCard).join('')}<p class="notice">Points are simulated locally. Real rewards require server-side verification and a payout system.</p></div>`}
function render(){if(!user){login();return}$('#navwrap').classList.remove('hidden');$('#nav').querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')screen.innerHTML=home();if(page==='tasks')screen.innerHTML=`<div class="title" style="padding-top:24px">Explore tasks 🎯</div><p class="muted small">Complete tasks to earn preview points.</p><div class="card"><span class="muted small">YOUR PROGRESS</span><p><b>${done.length} / ${tasks.length} completed</b></p><div style="height:6px;background:#293951;border-radius:9px;overflow:hidden"><div style="height:100%;width:${done.length/tasks.length*100}%;background:#50efbd"></div></div></div>${tasks.map(taskCard).join('')}`;if(page==='refer')screen.innerHTML=`<div class="title" style="padding-top:24px">Invite & Earn 🤝</div><p class="muted small">Share your invite code.</p><div class="card" style="text-align:center;padding:25px"><div style="font-size:45px">🎁</div><h3>Grow together</h3><p class="muted small">Example: 100 points per verified referral.</p><div class="muted small" style="margin-top:22px">YOUR INVITE CODE</div><b style="display:block;font-size:25px;letter-spacing:2px;margin:10px">EZ-TELE82</b><button class="btn" id="copy">Copy invite code</button></div><div class="warn">Referral tracking is not connected to a backend yet.</div>`;if(page==='wallet')screen.innerHTML=`<div class="title" style="padding-top:24px">My Wallet ▣</div><p class="muted small">Balance and sample requests.</p><div class="card"><span class="muted small">PREVIEW BALANCE</span><div class="balance">৳ ${balance.toLocaleString('en-BD')}</div><span class="muted small">Not redeemable for cash.</span></div><div class="card"><b>Withdrawal request</b><label class="muted small">Payment method</label><select id="method" class="field"><option>bKash</option><option>Nagad</option></select><label class="muted small">Amount (BDT)</label><input id="amount" class="field" type="number" placeholder="Enter amount"><label class="muted small">Account number</label><input id="account" class="field" placeholder="01XXXXXXXXX"><button class="btn" id="withdraw">Submit sample request</button><p class="notice">This form only saves a local sample request. No money is sent.</p></div>${requests.map(r=>`<div class="task"><div class="taskbody"><b>${esc(r.method)} · ৳${r.amount}</b><p>${esc(r.account)}</p></div><span class="pill">SAMPLE</span></div>`).join('')}`;if(page==='profile')screen.innerHTML=`<div class="title" style="padding-top:24px">Your profile</div><div class="card"><div style="font-size:28px">👤</div><h3>${esc([user.first_name,user.last_name].filter(Boolean).join(' ')||'Telegram User')}</h3><div class="muted small">${user.username?'@'+esc(user.username):'Telegram session'}</div><div class="muted small" style="margin-top:12px">Telegram user ID: ${esc(user.id||'Preview session')}</div></div><button class="btn" id="logout" style="background:#38212b;color:#ffb4c3">Sign out</button><div class="warn">Profile data is only authenticated when raw Telegram initData is verified by the backend.</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
screen.addEventListener('click',async e=>{if(e.target.closest('#login')){if(tg?.initData){tg.ready();tg.expand();try{let r=await fetch('/api/auth/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});if(r.ok){let d=await r.json();user=d.user;load();render();toast('Telegram identity verified by server.');return}}catch(err){}toast('Secure backend is not configured. Preview not authenticated.');return}user={id:'PREVIEW',first_name:'Preview User',username:'preview_user'};load();render();toast('Preview session only — not a real Telegram login.');return}let j=e.target.closest('[data-jump]');if(j){page=j.dataset.jump;render();return}let t=e.target.closest('[data-task]');if(t){let x=tasks.find(q=>q.id===+t.dataset.task);if(x&&!done.includes(x.id)){done.push(x.id);balance+=x.points;save();render();toast('+'+x.points+' preview points added.')}return}if(e.target.closest('#copy')){if(navigator.clipboard?.writeText)navigator.clipboard.writeText('EZ-TELE82').then(()=>toast('Code copied')).catch(()=>toast('Invite code: EZ-TELE82'));else toast('Invite code: EZ-TELE82')}if(e.target.closest('#withdraw')){let amount=Number($('#amount').value),account=$('#account').value.trim(),method=$('#method').value;if(!amount||amount<1||!account){toast('Enter valid amount and account.');return}if(amount>balance){toast('Not enough preview balance.');return}balance-=amount;requests.unshift({amount,account,method});save();render();toast('Sample request saved. No money sent.')}if(e.target.closest('#logout')){user=null;page='home';render()}});
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});if(tg){try{tg.ready();tg.setHeaderColor('#080d19');tg.setBackgroundColor('#080d19')}catch(e){}}render();
})();
</script></body></html>
