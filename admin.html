<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnZone Admin Starter</title><style>body{background:#0a1020;color:#f5f7ff;font-family:system-ui;max-width:700px;margin:auto;padding:22px}section{background:#121c2f;border:1px solid #293751;border-radius:16px;padding:18px;margin:14px 0}.muted{color:#9aa8be;font-size:13px}input{width:100%;box-sizing:border-box;padding:12px;background:#0a1220;color:white;border:1px solid #34435b;border-radius:10px;margin:6px 0 12px}button{padding:12px;border:0;border-radius:10px;background:#50efbd;font-weight:800}.warn{background:#392b18;color:#ffe2a4;padding:13px;border-radius:12px;line-height:1.6;font-size:13px}</style><h1>ϟ EarnZone Admin</h1><p class="muted">Local admin UI starter</p><div class="warn">This panel has no authentication and is not connected to live users. Do not use as a production admin panel until server-side admin roles and database permissions are implemented.</div><section><h3>Draft a task</h3><label>Title</label><input id="t" placeholder="Task title"><label>Description</label><input id="d" placeholder="Task description"><label>Points</label><input id="p" type="number" min="1" placeholder="50"><button id="s">Save draft locally</button><p id="msg" class="muted"></p></section><section><h3>Saved drafts</h3><div id="list" class="muted"></div></section><script>const k='ez-admin-drafts';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){let a=JSON.parse(localStorage.getItem(k)||'[]');list.innerHTML=a.length?a.map(x=>`<p><b>${esc(x.t)}</b><br>${esc(x.d)} · ${x.p} points</p>`).join(''):'No drafts yet'}s.onclick=()=>{let x={t:t.value.trim(),d:d.value.trim(),p:Number(p.value)};if(!x.t||!x.d||x.p<1){msg.textContent='Fill all fields correctly';return}let a=JSON.parse(localStorage.getItem(k)||'[]');a.push(x);localStorage.setItem(k,JSON.stringify(a));msg.textContent='Saved in this browser only';draw()};draw()</script></html>
